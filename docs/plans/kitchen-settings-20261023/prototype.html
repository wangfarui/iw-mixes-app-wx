<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>厨房设置 · 方案预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9edef;color:#252b30;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}header{max-width:1050px;margin:28px auto 20px;padding:0 22px}h1{font-size:23px;margin:0 0 10px}header p{color:#5f6871;line-height:1.7;margin:0}main{display:flex;gap:24px;justify-content:center;padding:0 20px 30px;align-items:flex-start}.phone{width:390px;height:min(780px,calc(100vh - 160px));min-height:540px;flex-shrink:0;background:#f5f5f5;border:1px solid #dce1e5;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 12px 34px #20304012}.bar{height:48px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;position:relative}.back{position:absolute;left:14px;background:none;font-size:23px}.body{height:calc(100% - 48px);overflow:auto;padding:18px 16px 100px}.group{background:#fff;border-radius:15px;overflow:hidden}.entry{display:flex;gap:14px;padding:21px 14px;width:100%;text-align:left;background:white;align-items:center;min-height:85px}.entry+.entry{border-top:1px solid #f1f1f1}.ico{width:42px;height:42px;background:#fff0d9;color:#b87a22;border-radius:12px;display:grid;place-items:center;font-size:21px}.text{flex:1;min-width:0}.entry b{font-weight:500;font-size:16px}.desc{display:block;font-size:12px;color:#858c93;margin-top:5px;line-height:1.5}.arrow{color:#b7bbc0;font-size:21px}.note{font-size:12px;line-height:1.8;color:#858c93;margin:17px 5px}.tabs{display:flex;background:#e8e9ec;border-radius:9px;padding:3px;margin-bottom:13px}.tabs button{flex:1;padding:9px;border-radius:7px;color:#626a73;background:none}.tabs .sel{background:#fff;color:#222;box-shadow:0 1px 3px #0001}.hint{font-size:12px;line-height:1.6;color:#7d8590;margin-bottom:18px}.section{display:flex;justify-content:space-between;color:#6a727b;font-size:13px;margin:22px 1px 10px}.link{color:#b87a22;background:none;padding:0}.row{display:flex;padding:18px 14px;border-bottom:1px solid #f1f1f1;align-items:center;gap:10px}.row .name{flex:1;word-break:break-all}.row button{background:none;color:#8b9197;padding:3px 6px}.badge{font-size:11px;color:#939aa3}.bottom{position:absolute;bottom:0;background:#f5f5f5ee;padding:12px 16px 24px;width:100%;display:grid;gap:10px}.primary{background:#b87a22;color:white;border-radius:10px;padding:13px;width:100%}.secondary{background:none;color:#b87a22;padding:5px}.filter{padding:11px;width:100%;border:1px solid #e4e6e8;border-radius:8px;background:#fff}.empty{text-align:center;color:#9198a1;padding:45px 8px}.shade{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end}.sheet{background:white;border-radius:20px 20px 0 0;width:100%;padding:22px 20px 28px}.sheet h2{font-size:18px;margin:0 0 20px}.sheet label{display:block;font-size:13px;color:#66707c;margin:14px 0 9px}.sheet input{width:100%;padding:14px;border:1px solid #dce0e5;border-radius:9px;outline-color:#b87a22}.actions{display:flex;gap:12px;margin-top:22px}.actions button{flex:1;border-radius:9px;padding:12px}.cancel{background:#f0f1f3;color:#59616a}.err{color:#c3444d;font-size:12px;margin-top:9px}.control{width:330px;background:white;padding:24px;border-radius:16px;line-height:1.8}.control h2{font-size:16px;margin:0 0 14px}.control p{font-size:13px;color:#737d87}.control button{margin:4px 5px 7px 0;background:#fff4e4;color:#9b661b;padding:8px 12px;border-radius:8px}.control .line{border-top:1px solid #eee;margin-top:15px;padding-top:15px}.toast{position:absolute;left:40px;right:40px;top:310px;background:#252b30ed;color:white;border-radius:10px;padding:18px;text-align:center;line-height:1.6}.home-indicator{height:4px;width:112px;border-radius:4px;background:#222;position:absolute;bottom:7px;left:calc(50% - 56px)}[hidden]{display:none!important}@media(max-width:780px){main{flex-direction:column;align-items:center}.control{width:min(390px,100%)}header{max-width:430px}.phone{max-width:100%}}

.phone{display:flex;flex-direction:column;height:560px;min-height:0}.bar{flex:none}.body{flex:1;min-height:0;height:auto;padding:18px 16px 24px}.bottom{position:static;flex:none;display:flex;gap:10px;background:white;border-top:1px solid #e8e8e8;padding:12px 16px 26px}.bottom button{flex:1;white-space:nowrap;font-size:14px}.bottom .secondary{flex:1.25;background:#fff5e5;border-radius:10px}.control select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px}.section button{font-size:13px}.sheet{max-height:85%;overflow:auto}.sheet .entry{min-height:52px;padding:14px}.check{display:flex;align-items:center;gap:12px;padding:12px 0}.check input{width:auto}.home-indicator{pointer-events:none}.badge{background:#f3f3f3;padding:4px 7px;border-radius:5px}.sheet input{color:#252b30}.sheet p{margin-bottom:0}header{max-width:790px}h1{font-size:22px}.note{line-height:1.8}.control button{font-size:13px}.row{min-height:62px}.shade{z-index:2}.actions{gap:12px}.bar{font-size:16px}body{padding-bottom:12px}
.control{padding:18px}.control p{font-size:12px;line-height:1.6;margin:9px 0}.control .line{margin-top:12px;padding-top:12px}.control h2{margin-bottom:10px}</style>
<header><h1>厨房设置 · 方案预览</h1><p>沿用衣柜设置交互。本页仅使用内存示例，不连接业务接口。</p></header>
<main><section class="phone"><div class="bar"><button class="back" id="back" aria-label="返回" onclick="home()">‹</button><span id="title">厨房设置</span></div><div class="body" id="content"></div><div class="bottom" id="footer" hidden></div><div id="overlay"></div><div class="home-indicator"></div></section>
<aside class="control"><h2>交互预览</h2><button onclick="home()">设置首页</button><button onclick="openType(0)">食材分类管理</button><button onclick="openType(1)">食材分区管理</button><div class="line"><h2>模拟身份</h2><select aria-label="模拟身份" onchange="demoRole=this.value;if(demoRole==='solo')scope='PERSONAL';sorting=false;render()"><option value="manager">群主 / 家长</option><option value="member">普通成员 / 儿童</option><option value="solo">无家庭</option></select><p>身份切换只用于预览，不进入正式页面。</p></div><div class="line"><h2>状态预览</h2><button onclick="state='loading';render()">加载中</button><button onclick="state='error';render()">读取失败</button><button onclick="state='empty';render()">空列表</button><button onclick="state='normal';render()">正常</button></div><div class="line"><h2>历史名称示例</h2><p>已保存食材：西兰花<br>分类：蔬菜 · 分区：冷藏</p><p>将分类“蔬菜”改为“蔬果”后，该食材仍显示“蔬菜”；主动重选分类才更新。</p><p>新增与复制按钮位于列表外，长列表可滚动至最后一项。</p></div></aside></main>
<script>
const types=['食材分类','食材分区'],descs=['管理食材的分类选项','管理食材存放分区'];
const seeds=[['蔬菜','水果','肉禽蛋','水产','奶制品','主食','调味品','饮品','其他'],['冷藏','冷冻','常温']];
const data={PERSONAL:seeds.map(a=>a.map((name,i)=>({name,enabled:i!==a.length-1}))),FAMILY:seeds.map(a=>a.map((name,i)=>({name,enabled:i!==a.length-1})))};data.PERSONAL[0].splice(2,0,{name:'烘焙原料',enabled:true});
let current=-1,scope='PERSONAL',demoRole='manager',state='normal',fold=false,sorting=false,backup=[];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function canWrite(){return scope==='PERSONAL'||demoRole==='manager'}
function home(){current=-1;sorting=false;state='normal';render()}
function openType(i){current=i;sorting=false;state='normal';fold=false;render()}
function changeScope(v){if(sorting)return;scope=v;fold=false;render()}
function render(){closeSheet();$('#back').hidden=current<0;$('#title').textContent=current<0?'厨房设置':types[current];let c=$('#content'),f=$('#footer');f.hidden=true;
if(current<0){c.innerHTML='<div class="group">'+types.map((t,i)=>`<button class="entry" onclick="openType(${i})"><span class="ico">${i?'▤':'▦'}</span><span class="text"><b>${t}</b><span class="desc">${descs[i]}</span></span><span class="arrow">›</span></button>`).join('')+'</div><p class="note">改名、停用或删除选项后，已有食材仍保留原来的分类、分区名称。</p>';return}
let list=data[scope][current],write=canWrite();c.innerHTML=demoRole==='solo'?'':`<div class="tabs"><button class="${scope==='PERSONAL'?'sel':''}" onclick="changeScope('PERSONAL')">我的</button><button class="${scope==='FAMILY'?'sel':''}" onclick="changeScope('FAMILY')">家庭共用</button></div>`;
c.innerHTML+=`<p class="hint">${scope==='PERSONAL'?'仅自己管理，用于我的食材':write?'家庭成员均可使用，群主和家长可管理':'家庭共用选项 · 当前仅可查看'}</p>`;
if(state==='loading'){c.innerHTML+='<div class="empty">加载中…</div>';return}if(state==='error'){c.innerHTML+=`<div class="empty">读取失败，请重试<br><button class="link" onclick="state='normal';render()">重试</button></div>`;return}
let rows=state==='empty'?[]:list;let enabled=rows.filter(x=>x.enabled),disabled=rows.filter(x=>!x.enabled);
c.innerHTML+=`<div class="section"><span>${sorting?'调整顺序':'已启用 · '+enabled.length+' 项'}</span>${write&&rows.length>1&&!sorting?'<button class="link" onclick="startSort()">排序</button>':''}</div>`;
function row(x){let i=list.indexOf(x);return `<div class="row"><span class="name">${esc(x.name)}</span>${!x.enabled?'<span class="badge">已停用</span>':''}${write?(sorting?`<button aria-label="上移${esc(x.name)}" onclick="move(${i},-1)">↑</button><button aria-label="下移${esc(x.name)}" onclick="move(${i},1)">↓</button>`:`<button aria-label="更多${esc(x.name)}" onclick="more(${i})">•••</button>`):''}</div>`}
c.innerHTML+=rows.length?'<div class="group">'+(sorting?rows:enabled).map(row).join('')+'</div>':'<div class="empty">暂无选项</div>';
if(disabled.length&&!sorting)c.innerHTML+=`<div class="section"><button class="link" onclick="fold=!fold;render()">已停用 · ${disabled.length} 项 ${fold?'⌃':'⌄'}</button></div>`+(fold?'<div class="group">'+disabled.map(row).join('')+'</div>':'');
if(write){f.hidden=false;f.innerHTML=sorting?'<button class="secondary" onclick="data[scope][current]=backup;sorting=false;render()">取消</button><button class="primary" onclick="sorting=false;render()">完成排序</button>':(scope==='FAMILY'?'<button class="secondary" onclick="copySheet()">从我的选项添加</button>':'')+`<button class="primary" onclick="edit(-1)">＋ 新增${types[current]}</button>`}
}
function sheet(content){$('#overlay').innerHTML='<div class="shade"><div class="sheet">'+content+'</div></div>'}
function closeSheet(){$('#overlay').innerHTML=''}
function edit(i){let item=data[scope][current][i];sheet(`<h2>${item?'修改名称':'新增'+types[current]}</h2><label for="name">${types[current]}名称</label><input id="name" placeholder="请输入名称" autocomplete="off" value="${esc(item?item.name:'')}"><div id="validation" class="err"></div><p class="note">1–32 个字符${item?'；已有食材保留原名称。':''}</p><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="save(${i})">保存</button></div>`)}
function save(i){if(!canWrite())return;let list=data[scope][current],name=$('#name').value.trim();if(!name||[...name].length>32){$('#validation').textContent='请输入1–32个字符';return}if(list.some((x,j)=>j!==i&&x.name===name)){$('#validation').textContent='此范围内已存在同名选项（含停用项）';return}if(i<0)list.push({name,enabled:true});else list[i]={...list[i],name};state='normal';render()}
function more(i){let x=data[scope][current][i];sheet(`<h2>${esc(x.name)}</h2><button class="entry" onclick="edit(${i})">修改名称</button><button class="entry" onclick="toggle(${i})">${x.enabled?'停用':'启用'}</button><button class="entry" style="color:#ba3947" onclick="removeSheet(${i})">删除</button><button class="entry" onclick="closeSheet()">取消</button>`)}
function toggle(i){if(!canWrite())return;data[scope][current][i].enabled=!data[scope][current][i].enabled;render()}
function removeSheet(i){sheet(`<h2>删除“${esc(data[scope][current][i].name)}”？</h2><p class="hint">已有食材保留原名称，之后录入不再提供此选项。</p><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="remove(${i})">确认删除</button></div>`)}
function remove(i){if(!canWrite())return;data[scope][current].splice(i,1);render()}
function startSort(){backup=data[scope][current].map(x=>({...x}));sorting=true;render()}
function move(i,d){let a=data[scope][current],j=i+d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];render()}}
function copySheet(){let personal=data.PERSONAL[current],family=data.FAMILY[current];sheet('<h2>从我的选项添加</h2><p class="hint">生成独立家庭选项，双方之后各自维护。</p>'+personal.map((x,i)=>{let exists=family.some(t=>t.name===x.name);return `<label class="check"><input type="checkbox" id="copy-${i}" ${exists||!x.enabled?'disabled':''}>${esc(x.name)}${exists?'（已存在）':!x.enabled?'（已停用）':''}</label>`}).join('')+'<div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="copySave()">添加到家庭</button></div>')}
function copySave(){if(!canWrite()||scope!=='FAMILY')return;data.PERSONAL[current].forEach((x,i)=>{let cb=$('#copy-'+i);if(cb?.checked&&!cb.disabled)data.FAMILY[current].push({...x})});render()}
render();
</script></html>
