<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衣柜设置 · 设计草案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edef;color:#252b30;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}header{max-width:1050px;margin:28px auto 20px;padding:0 22px}h1{font-size:23px;margin:0 0 10px}header p{color:#5f6871;line-height:1.7;margin:0}main{display:flex;gap:24px;justify-content:center;padding:0 20px 30px;align-items:flex-start}.phone{width:390px;height:min(780px,calc(100vh - 160px));min-height:540px;flex-shrink:0;background:#f5f5f5;border:1px solid #dce1e5;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 12px 34px #20304012}.bar{height:48px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;position:relative}.back{position:absolute;left:14px;background:none;font-size:23px}.body{height:calc(100% - 48px);overflow:auto;padding:18px 16px 100px}.group{background:#fff;border-radius:15px;overflow:hidden}.entry{display:flex;gap:14px;padding:21px 14px;width:100%;text-align:left;background:white;align-items:center;min-height:85px}.entry+.entry{border-top:1px solid #f1f1f1}.ico{width:42px;height:42px;background:#f2eaf8;color:#8c5fac;border-radius:12px;display:grid;place-items:center;font-size:21px}.text{flex:1;min-width:0}.entry b{font-weight:500;font-size:16px}.desc{display:block;font-size:12px;color:#858c93;margin-top:5px;line-height:1.5}.arrow{color:#b7bbc0;font-size:21px}.note{font-size:12px;line-height:1.8;color:#858c93;margin:17px 5px}.tabs{display:flex;background:#e8e9ec;border-radius:9px;padding:3px;margin-bottom:13px}.tabs button{flex:1;padding:9px;border-radius:7px;color:#626a73;background:none}.tabs .sel{background:#fff;color:#222;box-shadow:0 1px 3px #0001}.hint{font-size:12px;line-height:1.6;color:#7d8590;margin-bottom:18px}.section{display:flex;justify-content:space-between;color:#6a727b;font-size:13px;margin:22px 1px 10px}.link{color:#8c5fac;background:none;padding:0}.row{display:flex;padding:18px 14px;border-bottom:1px solid #f1f1f1;align-items:center;gap:10px}.row .name{flex:1;word-break:break-all}.row button{background:none;color:#8b9197;padding:3px 6px}.badge{font-size:11px;color:#939aa3}.bottom{position:absolute;bottom:0;background:#f5f5f5ee;padding:12px 16px 24px;width:100%;display:grid;gap:10px}.primary{background:#8c5fac;color:white;border-radius:10px;padding:13px;width:100%}.secondary{background:none;color:#8c5fac;padding:5px}.filter{padding:11px;width:100%;border:1px solid #e4e6e8;border-radius:8px;background:#fff}.empty{text-align:center;color:#9198a1;padding:45px 8px}.shade{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end}.sheet{background:white;border-radius:20px 20px 0 0;width:100%;padding:22px 20px 28px}.sheet h2{font-size:18px;margin:0 0 20px}.sheet label{display:block;font-size:13px;color:#66707c;margin:14px 0 9px}.sheet input{width:100%;padding:14px;border:1px solid #dce0e5;border-radius:9px;outline-color:#8c5fac}.actions{display:flex;gap:12px;margin-top:22px}.actions button{flex:1;border-radius:9px;padding:12px}.cancel{background:#f0f1f3;color:#59616a}.err{color:#c3444d;font-size:12px;margin-top:9px}.control{width:330px;background:white;padding:24px;border-radius:16px;line-height:1.8}.control h2{font-size:16px;margin:0 0 14px}.control p{font-size:13px;color:#737d87}.control button{margin:4px 5px 7px 0;background:#f2edf6;color:#795293;padding:8px 12px;border-radius:8px}.control .line{border-top:1px solid #eee;margin-top:15px;padding-top:15px}.toast{position:absolute;left:40px;right:40px;top:310px;background:#252b30ed;color:white;border-radius:10px;padding:18px;text-align:center;line-height:1.6}.home-indicator{height:4px;width:112px;border-radius:4px;background:#222;position:absolute;bottom:7px;left:calc(50% - 56px)}[hidden]{display:none!important}@media(max-width:780px){main{flex-direction:column;align-items:center}.control{width:min(390px,100%)}header{max-width:430px}.phone{max-width:100%}}
</style>
<header><h1>衣柜设置 · 交互草案</h1><p>参照记账设置的简洁列表与底部表单。示例数据仅保存在内存；家庭规则与快照方案仍待整体确认。</p></header>
<main><div class="phone"><div class="bar"><button class="back" id="back" aria-label="返回" onclick="home()">‹</button><span id="title">衣柜设置</span></div><div class="body" id="content"></div><div class="bottom" id="footer" hidden></div><div id="overlay"></div><div class="home-indicator"></div></div>
<aside class="control"><h2>操作预览</h2><p>点击五类设置进入管理页；可体验新增、改名、停用、排序、款式筛选与复制。返回首页不会重置内存示例。</p><button onclick="home()">设置首页</button><button onclick="openType(1)">款式管理</button><button onclick="mode='member';render()">家庭只读成员</button><button onclick="mode='manager';render()">家庭管理者</button><button onclick="mode='solo';scope='PERSONAL';render()">无家庭</button><div class="line"><h2>状态预览</h2><button onclick="status='loading';render()">加载中</button><button onclick="status='error';render()">加载失败</button><button onclick="status='empty';render()">空列表</button><button onclick="status='normal';render()">正常</button></div><div class="line"><h2>名称快照示例</h2><p id="snapshot">已保存衣物：衬衫<br>改名不会自动改变这条衣物的名称。用户重新选择款式时才更新快照。</p><p>正式页面使用微信原生导航、输入框与真实权限。右侧身份/状态开关属于原型工具，不进入产品。</p></div></aside></main>
<script>
const types=[['衣物品类','上装、下装、鞋履等衣物归类','▦'],['衣物款式','按品类整理 T恤、衬衫等款式','♧'],['衣物颜色','管理黑色、米色等颜色名称','◉'],['使用场景','通勤、运动等使用场景','◇'],['穿搭风格','简约、休闲等穿搭风格','✧']];
const matchCategories=['其他','上装','下装','连衣裙','内衣','袜子','鞋履','配饰','帽子','包袋','首饰'];
const seeds=[['上装','下装','鞋履'],['T恤','衬衫','毛衣'],['黑色','白色','米色'],['日常','通勤','运动'],['休闲','简约','复古']];let data={PERSONAL:seeds.map((a,type)=>a.map((name,i)=>({name,enabled:i!==2,parent:'上装',matchCategory:type===0?name:'其他'}))),FAMILY:seeds.map((a,type)=>a.map((name,i)=>({name,enabled:i!==2,parent:'上装',matchCategory:type===0?name:'其他'})))};
let current=-1,scope='PERSONAL',mode='manager',status='normal',showDisabled=false,parent='上装',sorting=false,sortBackup=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){current=-1;sorting=false;status='normal';$('#overlay').innerHTML='';render()}function openType(i){current=i;status='normal';showDisabled=false;sorting=false;render()}function writable(){return scope==='PERSONAL'||mode==='manager'}
function render(){let c=$('#content'),f=$('#footer');$('#overlay').innerHTML='';$('#back').hidden=current<0;$('#title').textContent=current<0?'衣柜设置':types[current][0];f.hidden=true;
if(current<0){c.innerHTML='<div class="group">'+types.map((t,i)=>`<button class="entry" onclick="openType(${i})"><span class="ico">${t[2]}</span><span class="text"><b>${t[0]}</b><span class="desc">${t[1]}</span></span><span class="arrow">›</span></button>`).join('')+'</div><p class="note">修改选项后，已保存的衣物、搭配和穿着记录保留原名称。</p>';return}
let can=writable(),list=data[scope][current];c.innerHTML=(mode==='solo'?'':`<div class="tabs"><button class="${scope==='PERSONAL'?'sel':''}" onclick="changeScope('PERSONAL')">我的</button><button class="${scope==='FAMILY'?'sel':''}" onclick="changeScope('FAMILY')">家庭共用</button></div>`)+`<div class="hint">${scope==='PERSONAL'?'仅自己管理；家庭代录按授权使用所需选项':can?'家庭成员均可使用，群主和家长可管理':'家庭共用选项 · 当前仅可查看'}</div>`;
if(current===1){c.innerHTML+=`<select aria-label="所属品类" class="filter" onchange="parent=this.value;render()"><option ${parent==='上装'?'selected':''}>上装</option><option ${parent==='下装'?'selected':''}>下装</option><option ${parent==='鞋履'?'selected':''}>鞋履</option></select>`;list=list.filter(x=>x.parent===parent)}
if(status==='loading'){c.innerHTML+='<div class="empty">正在加载…</div>';return}if(status==='error'){c.innerHTML+='<div class="empty">加载失败，请重试<br><button class="link" onclick="status=\'normal\';render()">重新加载</button></div>';return}
if(sorting){c.innerHTML+='<div class="hint">使用上移/下移调整；正式版同时支持拖动。</div>'}
let shown=status==='empty'?[]:list.filter(x=>x.enabled);c.innerHTML+=`<div class="section"><span>已启用 · ${shown.length} 项</span>${can&&!sorting&&shown.length?'<button class="link" onclick="startSort()">排序</button>':''}</div>`;
c.innerHTML+=shown.length?'<div class="group">'+shown.map(x=>{let i=data[scope][current].indexOf(x);return `<div class="row"><span class="name">${esc(x.name)}${current===0?`<span class="desc">搭配归类：${esc(x.matchCategory||'其他')}</span>`:''}</span>${can?(sorting?`<button aria-label="上移${esc(x.name)}" onclick="move(${i},-1)">↑</button><button aria-label="下移${esc(x.name)}" onclick="move(${i},1)">↓</button>`:`<button aria-label="更多${esc(x.name)}" onclick="more(${i})">•••</button>`):'<span class="badge">共用</span>'}</div>`}).join('')+'</div>':'<div class="empty">暂无可用选项</div>';
let disabled=status==='empty'?[]:list.filter(x=>!x.enabled);if(disabled.length&&!sorting)c.innerHTML+=`<div class="section"><button class="link" onclick="showDisabled=!showDisabled;render()">已停用 · ${disabled.length} 项 ${showDisabled?'⌃':'⌄'}</button></div>`+(showDisabled?'<div class="group">'+disabled.map(x=>`<div class="row"><span class="name">${esc(x.name)}</span><span class="badge">已停用</span>${can?`<button onclick="more(${data[scope][current].indexOf(x)})">•••</button>`:''}</div>`).join('')+'</div>':'');
if(can){f.hidden=false;f.innerHTML=sorting?'<button class="primary" onclick="sorting=false;render()">完成排序</button><button class="secondary" onclick="data[scope][current]=sortBackup;sorting=false;render()">取消排序</button>':`<button class="primary" onclick="edit(-1)">新增${types[current][0]}</button>`+(scope==='FAMILY'?'<button class="secondary" onclick="copySheet()">从我的选项添加</button>':'')}
}
function changeScope(v){if(sorting&&!confirm('放弃未保存排序？'))return;sorting=false;scope=v;showDisabled=false;render()}
function sheet(html){$('#overlay').innerHTML='<div class="shade"><div class="sheet">'+html+'</div></div>'}function closeSheet(){$('#overlay').innerHTML=''}
function edit(i){const item=data[scope][current][i];const categoryField=current!==0?'':item?`<label>搭配归类</label><div class="hint">${esc(item.matchCategory||'其他')}（改名时保持不变）</div>`:`<label for="matchCategory">搭配归类</label><select class="filter" id="matchCategory">${matchCategories.map(name=>`<option>${esc(name)}</option>`).join('')}</select><span class="desc">例如：外套归为上装，自动搭配时按上装处理。</span>`;sheet(`<h2>${item?'修改名称':'新增'+types[current][0]}</h2>${current===1?`<div class="hint">所属品类：${esc(parent)}</div>`:''}<label for="name">${types[current][0]}名称</label><input id="name" autocomplete="off" value="${esc(item?item.name:'')}" placeholder="请输入名称">${categoryField}<div class="err" id="validation"></div><p class="note">已有衣物、搭配和穿着记录保留原名称。</p><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="save(${i})">保存</button></div>`)}
function save(i){let name=$('#name').value.trim(),list=data[scope][current];if(!name||[...name].length>32){$('#validation').textContent='请输入1–32个字符';return}if(list.some((x,j)=>j!==i&&x.name===name&&(current!==1||x.parent===parent))){$('#validation').textContent='此范围内已存在同名选项';return}if(i<0)list.push({name,enabled:true,parent,matchCategory:current===0?$('#matchCategory').value:'其他'});else list[i]={...list[i],name};status='normal';render();toast('已保存；已有记录名称保持原样')}
function more(i){let x=data[scope][current][i];sheet(`<h2>${esc(x.name)}</h2><button class="entry" onclick="edit(${i})">修改名称</button><button class="entry" onclick="toggle(${i})">${x.enabled?'停用':'启用'}</button><button class="entry" style="color:#c3444d" onclick="removeItem(${i})">删除</button><button class="entry" onclick="closeSheet()">取消</button>`)}
function toggle(i){let x=data[scope][current][i];x.enabled=!x.enabled;render();toast(x.enabled?'已启用':'已停用；已有记录不受影响')}
function removeItem(i){sheet('<h2>删除这个选项？</h2><p class="hint">删除后无法再次选择，已有记录仍保留原名称。正式版删除品类前需先清理当前子款式。</p><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="data[scope][current].splice('+i+',1);render()">确认删除</button></div>')}
function startSort(){sortBackup=data[scope][current].map(x=>({...x}));sorting=true;render()}function move(i,d){let list=data[scope][current],j=i+d;while(j>=0&&j<list.length&&(!list[j].enabled||(current===1&&list[j].parent!==parent)))j+=d;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];render()}
function copySheet(){let list=data.PERSONAL[current].filter(x=>current!==1||x.parent===parent);sheet('<h2>从我的选项添加</h2><div class="hint">同名项已存在时跳过；款式所属品类在正式版中一并校验和映射。</div>'+list.map((x,i)=>`<label><input type="checkbox" style="width:auto" id="copy-${i}" ${data.FAMILY[current].some(t=>t.name===x.name&&(current!==1||t.parent===x.parent))?'disabled':''}> ${esc(x.name)} ${data.FAMILY[current].some(t=>t.name===x.name&&(current!==1||t.parent===x.parent))?'（已存在）':''}</label>`).join('')+'<div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="copySave()">添加到家庭</button></div>')}
function copySave(){data.PERSONAL[current].filter(x=>current!==1||x.parent===parent).forEach((x,i)=>{let cb=$('#copy-'+i);if(cb&&cb.checked&&!cb.disabled)data.FAMILY[current].push({...x})});render();toast('已添加到家庭；个人项保持独立')}
function toast(msg){closeSheet();let el=document.createElement('div');el.className='toast';el.textContent=msg;$('.phone').append(el);setTimeout(()=>el.remove(),1800)}render();
</script></html>
