<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号管理 · 设计预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202824;--green:#07a665;--muted:#818a85}*{box-sizing:border-box}body{margin:0;background:#edf1ee}button,input,textarea{font:inherit}button{border:0;cursor:pointer;background:transparent;color:inherit}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:2px solid var(--green)}.stage{max-width:1000px;margin:36px auto;display:flex;align-items:center;gap:64px;padding:0 24px}.phone{width:390px;height:844px;flex-shrink:0;background:#f5f6f7;border:1px solid #cbd2ce;border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 16px 48px #2448310e}.status{height:40px;display:flex;justify-content:space-between;padding:15px 24px 0;font-size:13px;font-weight:600}.nav{height:52px;display:flex;align-items:center;padding:0 18px;position:relative;flex-shrink:0}.nav-title{position:absolute;left:70px;right:70px;text-align:center;font-size:17px;font-weight:600}.back{font-size:32px;line-height:36px;padding:0;width:32px;text-align:left}.capsule{margin-left:auto;border:1px solid #dde1de;border-radius:22px;padding:5px 12px;font-size:14px;letter-spacing:3px;background:#ffffff88}main{flex:1;min-height:0;overflow:auto;padding:12px 16px 20px}.search-row{display:flex;align-items:center;gap:8px}.search{display:flex;gap:8px;align-items:center;background:#e9ecea;border-radius:12px;padding:12px;flex:1;min-width:0;color:var(--muted)}.search input{background:transparent;border:0;outline:0;width:100%;font-size:14px}.text{color:var(--green);font-size:13px;padding:10px 4px;white-space:nowrap}.filter-row{display:flex;align-items:center;gap:10px;margin:14px 0 6px}.chips{flex:1;min-width:0;overflow:auto;display:flex;gap:6px;scrollbar-width:none}.chip{padding:8px 13px;border-radius:18px;background:#e9ecea;white-space:nowrap;font-size:13px}.chip.active{background:var(--green);color:#fff}.section{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:16px 2px 12px}.group{background:#fff;border-radius:14px;overflow:hidden}.account{display:flex;align-items:center;padding:18px 12px;gap:12px}.account+.account,.category+.category{border-top:1px solid #f0f2f1}.avatar{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#e2f3e9;color:#188455;font-size:22px;font-weight:600}.account:nth-child(2n) .avatar{background:#eaf0fd;color:#5572a9}.account-main{flex:1;min-width:0;cursor:pointer}.name{font-size:16px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:8px;overflow-wrap:anywhere}.badge{color:#438367;background:#edf6f0;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:400}.sub{color:#66726b;font-size:12px;margin-top:8px;overflow-wrap:anywhere}.domain{color:#929c96;font-size:11px;margin-top:5px;overflow-wrap:anywhere}.copy{font-size:13px;padding:0 4px;color:#76867b}.eye{padding:10px 4px;color:#728078;font-size:20px;flex-shrink:0}.chevron{color:#9ca59f}.note{color:#8c9690;font-size:12px;line-height:1.7;margin:18px 4px}.empty{text-align:center;color:var(--muted);padding:70px 20px;line-height:2}.footer{padding:12px 16px 20px;background:#fff;border-top:1px solid #e8ede9}.primary{background:var(--green);color:white;border-radius:10px;height:48px;font-size:16px;font-weight:500;width:100%}.homebar{background:#fff;height:16px;position:relative;flex-shrink:0}.homebar:after{content:"";position:absolute;width:120px;height:4px;background:#202824;border-radius:8px;left:calc(50% - 60px);bottom:7px}.category{display:flex;align-items:center;gap:14px;padding:15px 16px;min-height:70px}.category .label{flex:1;text-align:left;padding:8px 0;overflow-wrap:anywhere}.category .count{font-size:12px;color:#89938d;margin-top:5px}.more{font-size:20px;letter-spacing:2px;padding:10px 6px;color:#76837a}.fold{margin-top:14px;border-radius:12px;background:#fff;padding:16px;width:100%;text-align:left;font-size:13px;color:#717c75}.disabled{opacity:.55}.sortbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px}.order{display:flex;gap:8px;font-size:12px;color:var(--green)}.overlay{position:absolute;inset:0;background:#15251d66;display:flex;align-items:flex-end;z-index:5}.sheet{background:#fff;border-radius:22px 22px 0 0;padding:12px 20px 30px;width:100%;max-height:80%;overflow:auto}.handle{width:36px;height:4px;border-radius:4px;background:#d9dfdb;margin:0 auto 20px}.sheet-head{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:600;margin:6px 0 24px}.close{font-size:24px;font-weight:400;padding:0 4px}.field{display:block;margin:16px 0;font-size:13px}.field input,.field textarea,.select{display:block;width:100%;padding:14px 12px;border:1px solid #d9e1db;border-radius:9px;margin-top:8px;background:#fff;outline-color:var(--green);font-size:15px}.field textarea{height:70px}.buttons{display:flex;gap:12px;margin-top:24px}.secondary{background:#edf0ee;border-radius:10px;padding:14px 22px;min-width:100px}.error{color:#c54949;font-size:12px}.danger{color:#c54a4a}.action{display:block;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid #edf1ee}.toast{position:absolute;bottom:105px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:12px;background:#203429ee;color:#fff;font-size:13px;z-index:20;white-space:nowrap}.aside{max-width:410px}.eyebrow{font-size:12px;color:#488668;letter-spacing:3px}h1{font-size:32px;line-height:1.3;font-weight:600;letter-spacing:-1px;margin:16px 0}p{color:#68776d;font-size:14px;line-height:1.9}.preview-controls{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.preview-controls button{padding:9px 13px;border:1px solid #ccd8cf;border-radius:8px;background:#fff;font-size:13px}.aside small{display:block;color:#8a968e;font-size:12px;line-height:1.8}@media(max-width:750px){.stage{margin:0 auto;padding:0;display:block;max-width:390px}.phone{border-radius:0;border:0;width:100%;height:100dvh}.aside{padding:24px;display:none}}
.copy{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;padding:0;border-radius:8px;vertical-align:middle}.copy img{width:16px;height:16px}.copy:active{background:#eaf0ed}.sub{display:flex;align-items:center;gap:4px;margin-top:3px;line-height:17px}.account-user{min-width:0;overflow-wrap:anywhere}.eye{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;width:66px;min-height:44px;flex:0 0 66px;padding:0;font-size:12px;color:#66746c}.eye:before{content:"";position:absolute;inset:5px 0;background:#f0f2f3;border-radius:12px}.eye img,.eye span{position:relative}.eye img{width:18px;height:18px}.eye:active:before{background:#e4eae6}.account{gap:10px}.account-main{min-width:0}
</style>
<div class="stage"><section class="phone"><div class="status"><span>9:41</span><span>▂▄▆ · 78%</span></div><div class="nav"><button class="back" onclick="back()" aria-label="返回">‹</button><span id="title" class="nav-title"></span><span class="capsule">··· │ ⊙</span></div><main id="main"></main><footer class="footer" id="footer"></footer><div class="homebar"></div><div id="layer"></div><div id="toast"></div></section><aside class="aside"><div class="eyebrow">IW · MINI PROGRAM</div><h1>账号好找，<br>分类顺手维护。</h1><p>搜索、分类筛选和账号操作聚在同一页。<br>从筛选区直接进入应用分类，保持熟悉的设置交互。</p><div class="preview-controls"><button onclick="screen='accounts';render()">账号列表</button><button onclick="screen='categories';render()">应用分类</button><button onclick="screen='categories';render();editCategory(1)">改名弹层</button><button onclick="accountEditor()">新增账号</button></div><p>可试：筛选分类、搜索应用、查看账号、编辑账号、新增分类、改名、启停、删除限制、排序取消。</p><small>2026-10-27 · 设计草稿<br>所有数据仅保存在当前页面内存中；刷新即重置。<br>原型不连接接口，不读取或展示真实密码。</small></aside></div>
<script>
let categories=[{id:1,name:'工作',enabled:true},{id:2,name:'生活',enabled:true},{id:3,name:'开发',enabled:true},{id:4,name:'其他',enabled:true},{id:5,name:'旧项目',enabled:false}];
let accounts=[{id:1,name:'GitHub',account:'demo_developer',address:'github.com',type:3},{id:2,name:'飞书',account:'demo@sample.com',address:'feishu.cn',type:1},{id:3,name:'Notion',account:'demo_notes',address:'notion.so',type:1},{id:4,name:'微信',account:'demo_wechat',address:'',type:2},{id:5,name:'开发平台',account:'demo_dev',address:'dev.example.com',type:3},{id:6,name:'历史应用',account:'demo_old',address:'old.example.com',type:5}];
let screen='accounts',selected=0,search='',addressFilter='',showDisabled=false,sortDraft=null,sheet=null,categoryId=6,accountId=7,pendingAccount=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),category=id=>categories.find(c=>c.id===Number(id)),count=id=>accounts.filter(a=>a.type===id).length;
function notify(text){$('toast').innerHTML='<div class="toast">'+esc(text)+'</div>';setTimeout(()=>$('toast').innerHTML='',2000)}
function back(){if(sheet){closeSheet();return}if(sortDraft){sortDraft=null;render();return}screen='accounts';render()}
function selectCategory(id){selected=id;render()}
function render(){closeSheet();$('title').textContent=screen==='accounts'?'账号管理':'应用分类';$('footer').style.display=sortDraft?'none':'block';$('footer').innerHTML='<button class="primary" onclick="'+(screen==='accounts'?'accountEditor()':'editCategory()')+'">＋ 新增'+(screen==='accounts'?'账号':'分类')+'</button>';
if(screen==='accounts'){
 const choices=categories.filter(c=>c.enabled||count(c.id)>0),rows=accounts.filter(a=>(!selected||a.type===selected)&&(!search||[a.name,a.address].some(v=>v.toLowerCase().includes(search.toLowerCase())))&&(!addressFilter||a.address.toLowerCase().includes(addressFilter.toLowerCase())));
 $('main').innerHTML='<div class="search-row"><label class="search">⌕ <input aria-label="搜索应用名称或地址" placeholder="搜索应用名称或地址" value="'+esc(search)+'" oninput="search=this.value;refreshSearch()"></label><button class="text" onclick="filterSheet()">筛选'+(addressFilter?' ·':'')+'</button></div><div class="filter-row"><div class="chips"><button class="chip '+(!selected?'active':'')+'" onclick="selectCategory(0)">全部</button>'+choices.map(c=>'<button class="chip '+(selected===c.id?'active':'')+'" onclick="selectCategory('+c.id+')">'+esc(c.name)+(!c.enabled?' · 已停用':'')+'</button>').join('')+'</div><button class="text" onclick="screen=\'categories\';render()">管理分类</button></div><div id="results"></div>';
 renderRows(rows);
}else{
 const row=c=>'<div class="category '+(!c.enabled?'disabled':'')+'"><button class="label" onclick="editCategory('+c.id+')">'+esc(c.name)+'<div class="count">'+count(c.id)+' 个账号'+(!c.enabled?' · 已停用':'')+'</div></button><button class="more" aria-label="'+esc(c.name)+'的更多操作" onclick="categoryMenu('+c.id+')">···</button></div>';
 $('main').innerHTML='<div class="note" style="margin-top:0">仅自己管理，用于我的应用账号</div>'+(sortDraft?'<div class="sortbar"><span>调整分类顺序</span><span><button onclick="sortDraft=null;render()">取消</button><button class="text" onclick="categories=sortDraft;sortDraft=null;render();notify(\'顺序已保存\')">完成</button></span></div><div class="group">'+sortDraft.map((c,i)=>'<div class="category"><span>☰</span><span style="flex:1">'+esc(c.name)+(!c.enabled?' · 已停用':'')+'</span><span class="order"><button '+(!i?'disabled':'')+' onclick="move('+i+',-1)">上移</button><button '+(i===sortDraft.length-1?'disabled':'')+' onclick="move('+i+',1)">下移</button></span></div>').join('')+'</div>':'<div class="section"><span>已启用 · '+categories.filter(c=>c.enabled).length+' 项</span><button class="text" onclick="sortDraft=categories.map(c=>({...c}));render()">排序</button></div><div class="group">'+categories.filter(c=>c.enabled).map(row).join('')+'</div>'+(categories.some(c=>!c.enabled)?'<button class="fold" onclick="showDisabled=!showDisabled;render()">'+(showDisabled?'⌃':'⌄')+'　已停用 · '+categories.filter(c=>!c.enabled).length+' 项</button>'+(showDisabled?'<div class="group" style="margin-top:12px">'+categories.filter(c=>!c.enabled).map(row).join('')+'</div>':''):'')+'<div class="note">分类改名后，账号会同步显示新名称。<br>被账号使用的分类需要先调整归属才能删除。</div>');
}}
function renderRows(rows){$('results').innerHTML='<div class="section">共 '+rows.length+' 个账号</div><div class="group">'+rows.map(a=>'<div class="account"><div class="avatar" onclick="accountEditor('+a.id+')">'+esc(a.name.slice(0,1))+'</div><div class="account-main" onclick="accountEditor('+a.id+')"><div class="name">'+esc(a.name)+'<span class="badge">'+esc(category(a.type)?.name||'未分类')+'</span></div><div class="sub"><span class="account-user">'+esc(a.account)+'</span><button class="copy" aria-label="复制账号" onclick="event.stopPropagation();notify(\'原型：账号复制操作\')"><img src="assets/copy.svg" alt="" aria-hidden="true"></button></div>'+(a.address?'<div class="domain">'+esc(a.address)+'</div>':'')+'</div><button class="eye" aria-label="查看密码" onclick="passwordSheet('+a.id+')"><img src="assets/eye.svg" alt="" aria-hidden="true"><span>密码</span></button></div>').join('')+'</div>'+(rows.length?'<div class="note" style="text-align:center">已展示全部示例账号</div>':'<div class="empty">没有找到账号<br><button class="text" onclick="selected=0;search=\'\';addressFilter=\'\';render()">清除筛选</button></div>')}
function refreshSearch(){renderRows(accounts.filter(a=>(!selected||a.type===selected)&&(!search||[a.name,a.address].some(v=>v.toLowerCase().includes(search.toLowerCase())))&&(!addressFilter||a.address.toLowerCase().includes(addressFilter.toLowerCase()))))}
function showSheet(title,html){sheet=title;$('layer').innerHTML='<div class="overlay"><section class="sheet"><div class="handle"></div><div class="sheet-head">'+esc(title)+'<button class="close" onclick="closeSheet()" aria-label="关闭">×</button></div>'+html+'</section></div>'}
function closeSheet(){sheet=null;$('layer').innerHTML=''}
function editCategory(id){const c=category(id);showSheet(c?'修改分类':'新增分类','<label class="field">分类名称<input id="categoryName" value="'+esc(c?.name||'')+'" placeholder="例如：工作、生活、开发" oninput="$(\'error\').textContent=\'\';$(\'charCount\').textContent=Array.from(this.value.trim()).length+\' / 32\'"></label><div class="note" id="charCount">'+Array.from(c?.name||'').length+' / 32</div><div class="error" id="error"></div><div class="note">'+(c?'修改后，使用此分类的账号将同步更新名称':'分类仅自己可用；名称不能与现有分类重复')+'</div><div class="buttons"><button class="secondary" onclick="closeSheet()">取消</button><button class="primary" onclick="saveCategory('+(id||0)+')">保存</button></div>')}
function saveCategory(id){let name=$('categoryName').value.trim();if(!name||Array.from(name).length>32){$('error').textContent='请输入 1–32 个字符的分类名称';return}if(categories.some(c=>c.id!==id&&c.name===name)){$('error').textContent='该名称已存在（含停用分类）';return}if(id)category(id).name=name;else categories.push({id:categoryId++,name,enabled:true});render();notify('分类已保存')}
function categoryMenu(id){const c=category(id);showSheet(c.name,'<button class="action" onclick="editCategory('+id+')">修改名称</button><button class="action" onclick="category('+id+').enabled=!category('+id+').enabled;render();notify(\'状态已更新\')">'+(c.enabled?'停用':'启用')+'分类</button><button class="action danger" onclick="deleteCategory('+id+')">删除分类</button>')}
function deleteCategory(id){if(count(id)){showSheet('该分类正在使用','<p>仍有 '+count(id)+' 个账号使用「'+esc(category(id).name)+'」。请先调整账号分类，再删除。</p><button class="primary" onclick="selected='+id+';screen=\'accounts\';render()">查看相关账号</button>');return}showSheet('删除分类','<p>确认删除「'+esc(category(id).name)+'」吗？</p><div class="buttons"><button class="secondary" onclick="closeSheet()">取消</button><button class="primary" onclick="categories=categories.filter(c=>c.id!=='+id+');if(selected==='+id+')selected=0;render();notify(\'分类已删除\')">确认删除</button></div>')}
function move(i,d){[sortDraft[i],sortDraft[i+d]]=[sortDraft[i+d],sortDraft[i]];render()}
function filterSheet(){showSheet('精确筛选','<label class="field">应用地址<input id="addressFilter" placeholder="输入域名或地址片段" value="'+esc(addressFilter)+'"></label><div class="buttons"><button class="secondary" onclick="addressFilter=\'\';render()">重置</button><button class="primary" onclick="addressFilter=$(\'addressFilter\').value.trim();render()">应用筛选</button></div>')}
function passwordSheet(id){let a=accounts.find(a=>a.id===id);showSheet(a.name+' · 密码','<div style="font-size:24px;letter-spacing:5px;padding:20px 0">••••••••</div><div class="note">原型仅演示查看入口，未读取真实密码。</div><button class="primary" onclick="notify(\'原型：密码复制操作\')">复制密码</button>')}
function accountEditor(id){let a=accounts.find(a=>a.id===id)||{name:'',account:'',address:'',type:0};pendingAccount={...a};showSheet(id?'编辑账号':'新增账号','<label class="field">应用名称<input id="aName" value="'+esc(a.name)+'" placeholder="例如：GitHub"></label><label class="field">应用地址<input id="aAddress" value="'+esc(a.address)+'" placeholder="例如：github.com"></label><label class="field">账号<input id="aAccount" value="'+esc(a.account)+'" placeholder="用户名、邮箱或手机号"></label><div class="field">应用分类 <button class="text" style="float:right;padding:0" onclick="accountCategoryPicker()">选择 / 快速新增</button><div class="select" id="selectedLabel">'+esc(category(a.type)?.name||'未分类')+'</div></div><label class="field">密码<input id="aPassword" type="password" placeholder="'+(id?'不修改则留空':'请输入密码')+'"></label><div class="error" id="aError"></div><div class="buttons"><button class="secondary" onclick="closeSheet()">取消</button><button class="primary" onclick="saveAccount()">保存</button></div>')}
function rememberDraft(){pendingAccount={...pendingAccount,name:$('aName').value,address:$('aAddress').value,account:$('aAccount').value,password:$('aPassword').value}}
function accountCategoryPicker(){rememberDraft();showSheet('选择应用分类',categories.filter(c=>c.enabled||c.id===pendingAccount.type).map(c=>'<button class="action" onclick="pendingAccount.type='+c.id+';restoreEditor()">'+esc(c.name)+(c.enabled?'':' · 已停用（当前分类）')+'</button>').join('')+'<button class="action" onclick="pendingAccount.type=0;restoreEditor()">未分类</button><label class="field">快速新增分类<input id="quickName" placeholder="输入新分类名称"></label><div class="error" id="qError"></div><button class="primary" onclick="quickCategory()">新增并选用</button><button class="action" onclick="restoreEditor()">返回账号编辑</button>')}
function restoreEditor(){let draft={...pendingAccount};accountEditor(draft.id);pendingAccount=draft;$('aName').value=draft.name;$('aAddress').value=draft.address;$('aAccount').value=draft.account;$('aPassword').value=draft.password||'';$('selectedLabel').textContent=category(draft.type)?.name||'未分类'}
function quickCategory(){let name=$('quickName').value.trim();if(!name||Array.from(name).length>32||categories.some(c=>c.name===name)){$('qError').textContent='请输入 1–32 个字符且不重复的名称';return}let id=categoryId++;categories.push({id,name,enabled:true});pendingAccount.type=id;restoreEditor();notify('已新增并选用分类')}
function saveAccount(){rememberDraft();if(!pendingAccount.name&&!pendingAccount.address&&!pendingAccount.account){$('aError').textContent='应用名称、应用地址、账号至少填写一项';return}if(pendingAccount.id){Object.assign(accounts.find(a=>a.id===pendingAccount.id),pendingAccount)}else accounts.push({...pendingAccount,id:accountId++});screen='accounts';render();notify('账号已保存（仅原型内存）')}
render();
</script>
</html>
